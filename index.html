<script>
(function(){
  function show(msg){
    var b = document.getElementById('gk-errors');
    if(!b) return;
    b.style.display = 'block';
    var d = document.createElement('div');
    d.textContent = '• ' + msg;
    b.appendChild(d);
    var n = document.getElementById('gk-splash-note');
    if(n) n.textContent = 'Ceva nu s-a încărcat. Trimite-i lui Claude ce scrie mai jos:';
  }
  window.__gkShowError = show;
  window.addEventListener('error', function(e){
    if (e.target && e.target.tagName === 'SCRIPT') { show('Nu s-a putut descărca: ' + (e.target.src || 'script')); }
    else if (e.message) { show(e.message); }
  }, true);
})();
</script>
